name: Update Contribution Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-calendar
  cancel-in-progress: false

jobs:
  generate-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-contribution-calendar.mjs

      - name: Commit calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/contribution-calendar.svg

          git diff --cached --quiet && exit 0

          git commit -m "chore: update contribution calendar"

      - name: Push calendar
        run: |
          git pull --rebase origin main

          for attempt in 1 2 3 4 5
          do
            echo "Push attempt $attempt..."

            if git push origin main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Waiting before retry..."

            sleep $((attempt * 10))

            git pull --rebase origin main
          done

          echo "All push attempts failed."
          exit 1
