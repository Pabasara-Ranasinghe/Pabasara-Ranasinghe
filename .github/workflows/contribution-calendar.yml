name: Contribution Calendar

on:
  # 1. Triggers every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # 2. Allows manual trigger from the Actions tab anytime
  workflow_dispatch:

  # 3. Runs on pushes to the main branch
  push:
    branches:
      - main

# Grant write permissions so the runner can commit and push back to the repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Contribution Calendar
        run: node scripts/generate-contribution-calendar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Updated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/contribution-calendar-light.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update contribution calendar" && git push)
