name: Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Pabasara-Ranasinghe
        run: |
          node scripts/generate-contribution-calendar.mjs

      - name: Save generated calendar
        run: |
          cp public/contribution-calendar-light.svg /tmp/contribution-calendar-light.svg

      - name: Switch to output branch
        run: |
          git fetch origin output || true

          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi

      - name: Publish contribution calendar
        run: |
          mkdir -p public

          cp /tmp/contribution-calendar-light.svg \
             public/contribution-calendar-light.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/contribution-calendar-light.svg

          git commit -m "chore: update contribution calendar" || echo "No changes to commit."

          git push origin output
